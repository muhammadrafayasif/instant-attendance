name: Backend Deployment CI/CD
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy_backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: backend
      url: https://nedfetch.ddns.net

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Upload code
        run: |
          rsync -rlvz --delete \
            --exclude '.venv/' --exclude 'venv/' --exclude '.env' \
            --exclude '__pycache__/' --exclude '.git/' \
            backend/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/ubuntu/backend_IA/

      - name: Install dependencies and restart
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd /home/ubuntu/backend_IA &&
            ./.venv/bin/pip install -r requirements.txt &&
            sudo systemctl restart attendance.service &&
            sleep 3 &&
            systemctl is-active attendance.service
          "